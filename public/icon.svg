<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background so it also works as a maskable icon; artwork stays in the central safe zone. -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4d53" />
      <stop offset="1" stop-color="#2a2c30" />
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62666d" />
      <stop offset="1" stop-color="#43464b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#panel)" />
  <!-- 4x4 pads, some LEDs lit -->
  <g fill="url(#pad)" stroke="#16171a" stroke-width="4">
    <rect x="116" y="116" width="62" height="62" /><rect x="190" y="116" width="62" height="62" /><rect x="264" y="116" width="62" height="62" /><rect x="338" y="116" width="62" height="62" />
    <rect x="116" y="190" width="62" height="62" /><rect x="190" y="190" width="62" height="62" /><rect x="264" y="190" width="62" height="62" /><rect x="338" y="190" width="62" height="62" />
    <rect x="116" y="264" width="62" height="62" /><rect x="190" y="264" width="62" height="62" /><rect x="264" y="264" width="62" height="62" /><rect x="338" y="264" width="62" height="62" />
    <rect x="116" y="338" width="62" height="62" /><rect x="190" y="338" width="62" height="62" /><rect x="264" y="338" width="62" height="62" /><rect x="338" y="338" width="62" height="62" />
  </g>
  <g stroke="#000" stroke-width="2">
    <!-- LEDs: off = dark amber, on = lit amber -->
    <g fill="#4a3818">
      <rect x="133" y="124" width="28" height="10" /><rect x="207" y="124" width="28" height="10" /><rect x="355" y="124" width="28" height="10" />
      <rect x="133" y="198" width="28" height="10" /><rect x="281" y="198" width="28" height="10" />
      <rect x="207" y="272" width="28" height="10" /><rect x="281" y="272" width="28" height="10" /><rect x="355" y="272" width="28" height="10" />
      <rect x="133" y="346" width="28" height="10" /><rect x="355" y="346" width="28" height="10" />
    </g>
    <g fill="#ffb02e">
      <rect x="281" y="124" width="28" height="10" />
      <rect x="207" y="198" width="28" height="10" /><rect x="355" y="198" width="28" height="10" />
      <rect x="133" y="272" width="28" height="10" />
      <rect x="207" y="346" width="28" height="10" /><rect x="281" y="346" width="28" height="10" />
    </g>
  </g>
</svg>
